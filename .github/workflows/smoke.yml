# IPv64 Register Runner — distribution workflow
#
# 用法：
#   1. 把这个文件保存到你自己的仓库 `.github/workflows/register.yml`
#   2. 不需要 PAT / Secret；运行时会从公开仓库 xbox-cn/ipv64-runner-dist 拉代码
#   3. Actions -> IPv64 Register Runner -> Run workflow
#
# 默认：256 个 job，每个 job 5 个并发 lane，每个 lane 目标 15 个成功账号。
# 单 job 目标 = 5 × 15 = 75 个账号；256 job 总目标 = 19200 个账号。
# 测试时把 job_count 改成 1。

name: IPv64 Register Runner

on:
  workflow_dispatch:
    inputs:
      job_count:
        description: "并行 job 数（1-256；每个 job 独立 runner）"
        required: false
        default: "256"
      workers:
        description: "每个 job 的并发 lane 数"
        required: false
        default: "5"
      count:
        description: "每个 lane 的目标成功账号数"
        required: false
        default: "15"
      proxy:
        description: "可选代理（host:port 或完整 URL）"
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate job matrix
        id: gen
        env:
          N: ${{ inputs.job_count }}
        run: |
          M=$(python3 -c "import json,os;n=max(1,min(256,int(os.environ.get('N') or 1)));print(json.dumps(list(range(n))))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "matrix=$M"

  register:
    name: "IPv64 register ${{ matrix.idx }}"
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Mask proxy
        shell: pwsh
        run: Write-Host "::add-mask::${{ inputs.proxy }}"

      - name: Pull public code
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/ipv64-runner-dist
          ref: main
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements.txt

      - name: Install deps
        shell: pwsh
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate Chrome
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { Write-Error "Chrome not found on runner"; exit 1 }
          Write-Host "chrome=$chrome"
          "CHROME_PATH=$chrome" >> $env:GITHUB_ENV

      - name: Register
        shell: pwsh
        working-directory: code
        env:
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_PROXY: ${{ inputs.proxy }}
        run: |
          $cliArgs = @(
            "-u", "batch_register.py",
            "--workers", $env:INPUT_WORKERS,
            "--count", $env:INPUT_COUNT,
            "--out-dir", "out",
            "--chrome", $env:CHROME_PATH
          )
          if ($env:INPUT_PROXY) { $cliArgs += @("--proxy", $env:INPUT_PROXY) }
          Write-Host "args: $($cliArgs -join ' ')"
          python @cliArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipv64-${{ matrix.idx }}-${{ github.run_id }}
          retention-days: 1
          path: |
            code/out/accounts.jsonl
            code/out/attempts.jsonl
            code/out/summary.json
          if-no-files-found: ignore