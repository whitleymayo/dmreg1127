# IPv64 public-pull smoke test
# 目的：在公开测试仓库里验证“从公开代码仓库 ipv64-runner-dist 拉取代码”的链路。
# 只跑 1 个 job / 1 个 lane / 1 个账号，不影响默认的 256 job public.yml。

name: IPv64 Public Pull Smoke

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "并发 lane 数（冒烟默认 1）"
        required: false
        default: "1"
      count:
        description: "每个 lane 目标成功数（冒烟默认 1）"
        required: false
        default: "1"
      proxy:
        description: "可选代理"
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    name: Public pull smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Mask proxy
        shell: pwsh
        run: Write-Host "::add-mask::${{ inputs.proxy }}"

      - name: Pull public code
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/ipv64-runner-dist
          ref: main
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements.txt

      - name: Install deps
        shell: pwsh
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate Chrome
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { Write-Error "Chrome not found"; exit 1 }
          Write-Host "chrome=$chrome"
          "CHROME_PATH=$chrome" >> $env:GITHUB_ENV

      - name: Register smoke
        shell: pwsh
        working-directory: code
        env:
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_PROXY: ${{ inputs.proxy }}
        run: |
          $cliArgs = @(
            "-u", "batch_register.py",
            "--workers", $env:INPUT_WORKERS,
            "--count", $env:INPUT_COUNT,
            "--out-dir", "out",
            "--chrome", $env:CHROME_PATH
          )
          if ($env:INPUT_PROXY) { $cliArgs += @("--proxy", $env:INPUT_PROXY) }
          Write-Host "args: $($cliArgs -join ' ')"
          python @cliArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipv64-public-pull-smoke
          retention-days: 1
          path: |
            code/out/accounts.jsonl
            code/out/attempts.jsonl
            code/out/summary.json
          if-no-files-found: ignore
